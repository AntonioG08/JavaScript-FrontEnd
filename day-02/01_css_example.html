<!DOCTYPE html>
    <head>
        <title>Ejercicio | Prueba de CSS</title>
    </head>
    <body>
        <p style="color:darkblue; 
                  background-color: beige;
                  font-family: fantasy, sans-serif;
                  font-size: 3em;">Este es un ejemplo</p>
        <!--Why do we have 2 fonts in "font-family"?? That's becase, it could happen that we choose a font, but the server doesn't has
            that font available, therefore, the user will not be able to see the text/informtion. This method, is telling to the server,
            to first try with "fantasy", and if by any chance, one user doesn't has that font available on its server, then it will fall to
            sans-serif, which is a more common font-family.
            With that in mind, we can put multiple fonts in a list, to handle the case where multiple fonts may not be available in someones
            server.-->
        
        <br>
        <p style="margin: 20px;
                  border: 3px;
                  border-style: solid;
                  border-color: blue;
                  padding: 10px;">Este es otro texto de ejemplo</p>
    </body>
</head>
