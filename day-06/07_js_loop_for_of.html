<!DOCTYPE html>

<head>
    <title>Loop For Of</title>
    <link>
    <script></script>
</head>

<body>
    <h1>Ejemplo de un código con loop "For... Of" </h1>
    <br>
    <br>
    <button onclick="showElements()">Ver los elementos de la lista</button>
    <ul id="forElements">

    </ul>
</body>
<script>
    //Basic example of a "For Of" code
    let totalSubjects = 0;
    let schoolSubjects = ["history", "english", "math", "biology"];
    for (let subject of schoolSubjects) {
        totalSubjects++;
        document.write("You are enrolled in the class: " + subject + "<br>");
    }
    document.write("In total, you are enrolled in: " + totalSubjects);


    //Initialize the variables that will be used for this exercise
    let myArray = ['a', 'b', 'c', 'd'];
    let ulList = document.getElementById("forElements");

    function showElements() {
        //Clean the list in case the code has been executed before
        ulList.innerHTML = "";

        //While loop, that may or not execute 
        for (let x of myArray) {
            let newItem = document.createElement("li");
            newItem.innerText = x;
            ulList.appendChild(newItem);
        }
    }

</script>

</html>
