<!DOCTYPE html>

<head>
    <title>Loop While</title>
    <link>
    <script></script>
</head>

<body>
    <h1>Ejemplo de un código con loop "While" </h1>
    <br>
    <br>
    <h3 id="myName"></h3>
</body>
<script>
    //Initialize the variables that will be used for this exercise
    let userName;
    let nameText = document.getElementById("myName");

    /*IF the parameter is given, the condition is false, and the 
      while block is not executed*/
    //userName = antonio;

    //While loop, that may or not execute 
    while (userName != "antonio") {
        userName = prompt("Di mi nombre (minúsculas)");
    };

    //Update a text in the HTML once the condition is met and the loop is broken
    nameText.textContent = "Ese es mi nombre!";


</script>

</html>
