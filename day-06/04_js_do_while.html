<!DOCTYPE html>

<head>
    <title>Loop Do... While</title>
    <link>
    <script></script>
</head>

<body>
    <h1>Ejemplo de un código con loop "Do... while" </h1>
    <h3>Revisar los mensajes en la consola</h3>

</body>
<script>
    //Initialize a variable that will be used in our main loop
    let vidas = 5;

    do {
        //Show a message in the console
        console.log(`Vidas: ${vidas}`);

        //Substract 1 on each iterarion, to update the parameter
        vidas--;
    } while (vidas >= 0);
</script>

</html>
