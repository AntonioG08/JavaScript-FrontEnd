<!DOCTYPE html>

<head>
    <title>Loop Do... While</title>
    <link>
    <script></script>
</head>

<body>
    <h1>Ejemplo de un código con loop "Do... while" </h1>
    <br>
    <br>
    <h3 id="miNombre"></h3>
</body>
<script>
    /*Prompt element displays a text box to the user, indicating to 
      pass some text. The parameters are these:
      prompt(Instructions, Placeholder)
      
      The information coming from the prompt can be saved into a variable
      to be used later in any logic of the code*/
    let textoUsuarioPrueba = prompt("Escribe algo", "Por favor escriba aqui");

    let nombre;
    let textoNombre = document.getElementById("miNombre");

    do {
        nombre = prompt("Di mi nombre (en minúsculas)");
    } while (nombre != "antonio");

    textoNombre.textContent = "Ese es mi nombre!";

</script>

</html>
