<!DOCTYPE html>
    <head>
        <title>Ejercicio | Links</title>
    </head>
    <body>
        <h1>Ejercicio sobre enlaces dentro de HTML</h1>
        <p>Ingresa a <a href="https://www.youtube.com/" target="_blank">este enlace</a> para tener mas informacion de lo que quieras</p>
        <br>
        <p>Nota: El atributo <b>target="_blank"</b> sirve para que cuando el usuario haga click en un link, se cree otra pestaña, en vez 
           de perjudicar la pestaña actual</p>
    </body>
</html>
