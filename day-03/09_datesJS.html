<!DOCTYPE html>
    <head>
        <title>Ejercicio | Fechas en JavaScript</title>
        <link rel="stylesheet" href="09_exercise.css">
    </head>
    <body onload="startClock()">
        <input type="number" placeholder="Ingresa cuantos segundos de espera" id="chosenTime">
        <button onclick="startTimer()">Alarma</button>
        <h1 id="alarmText">00:00:00</h1>

        <audio id="alarmAudio">
            <source src="alarma.mp3" type="audio/mpeg">
            Sonido no habilitado
        </audio>

        <script>
            let secondsElement = document.getElementById("chosenTime");
            let alarmElement = document.getElementById("alarmText");
            let alarmSoundElement = document.getElementById("alarmAudio");
            
            function startTimer(){
                setTimeout(timeUp, 1000 * secondsElement.value);
            }

            function timeUp(){
                alarmElement.style.color = "green";
                alarmSoundElement.play();
            }

            function startClock(){
                setInterval(tick, 1000);
            }

            function tick(){
                let currentTime = new Date();
                let hours = String(currentTime.getHours()).padStart(2, "0");
                let minutes = String(currentTime.getMinutes()).padStart(2, "0");
                let seconds = String(currentTime.getSeconds()).padStart(2, "0");

                let timeText = hours + ":" + minutes + ":" + seconds;
                alarmElement.textContent = timeText;
            }
        </script>
    </body>
</html>
