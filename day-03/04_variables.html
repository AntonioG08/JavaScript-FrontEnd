<!DOCTYPE html>
    <head>
        <title>Ejercicio | Uso de variables</title>
    </head>
    <body>
        <h1>Ejercicio de variables de JavaScript</h1>
    </body>
    <script>
        let miNombre = "Antonio Gómez Ruiz";
        let edad;

        edad = 25;
        alert("Me llamo " + miNombre + " y tengo " + edad + " años.")

        edad = 17;
        alert("Me llamo " + miNombre + " y tengo " + edad + " años.")
    </script>
</html>
