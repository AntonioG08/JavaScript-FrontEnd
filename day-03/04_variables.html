<!DOCTYPE html>
    <head>
        <title>Ejercicio | Uso de variables</title>
    </head>
    <body>
        <h1>Ejercicio de variables de JavaScript</h1>
    </body>
    <script>
        let myName = "Antonio Gómez Ruiz";
        let age;

        age = 25;
        alert("Me llamo " + myName + " y tengo " + age + " años.")

        age = 17;
        alert("Me llamo " + myName + " y tengo " + age + " años.")
    </script>
</html>
