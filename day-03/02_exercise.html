<!DOCTYPE html>
    <head>
        <title>Ejercicio | Primera prueba de JS</title>
        <link rel="stylesheet" href="01_exercise.css">
    </head>
    <body>
        <p>Ingresa tu nombre por favor</p>
        <input type="text" placeholder="Mi nombre" id="username">
        <button onclick="greetUser()">Saludar</button>
    </body>
    <script>
        function greetUser(){
            alert("Hola " + document.getElementById("username").value + "! Saludos")
        }
    </script>
</html>
