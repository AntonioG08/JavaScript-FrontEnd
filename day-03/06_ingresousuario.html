<!DOCTYPE html>
    <head>
        <title>Ejercicio | Ingreso de usuario</title>
    </head>
    <body>
        <h1>Prueba</h1>
        <br>

        <p>Ingresa tu usuario/nombre</p>
        <input type="text" id="username" placeholder="Mi nombre">
        <button onclick="showName()">Ingresar</button>
        <h3 id="greeting">No se tu nombre</h3>
        <script>
            function showName(){
                let nameElement = document.getElementById("username");
                let textElement = document.getElementById("greeting");
                textElement.textContent = "Saludos, " + nameElement.value;
            }
        </script>
    </body>
</html>
