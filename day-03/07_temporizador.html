<!DOCTYPE html>
    <head>
        <title>Ejercicio | Temporizador</title>
    </head>
    <body>
        <input type="number" placeholder="Ingresa cuantos segundos de espera" id="chosenTime">
        <button onclick="startTimer()">Alarma</button>
        <h1 id="alarmText" style="color: red;">APAGADO</h1>

        <script>
            let secondsElement = document.getElementById("chosenTime");
            let alarmElement = document.getElementById("alarmText")
            
            function startTimer(){
                setTimeout(timeUp, 1000 * secondsElement.value);
            }

            function timeUp(){
                alert("Se acabo el tiempo");
                alarmElement.textContent = "ENCENDIDO";
                alarmElement.style.color = "green";

            }
        </script>
    </body>
</html>
