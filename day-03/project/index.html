<!DOCTYPE html>
    <head>
        <title>Proyecto 3 | Responde rápido</title>
        <link rel="stylesheet" href="proyecto3.css">
    </head>
    <body onload="startCountdown()">
        <h2>Responde a las preguntas lo más rápido que puedas <span id="countdown"></span></h2>
        <p>1. Cual es la capital de México?</p>
        <input type="text" id="answer1">

        <p>2. Cuanto es 7x7?</p>
        <input type="text" id="answer2">

        <p>3. Colores de la bandera de Francia?</p>
        <input type="text" id="answer3">

        <p>4. Cual es el año actual?</p>
        <input type="text" id="answer4">

        <p>5. Bebida mas famosa a nivel mundial?</p>
        <input type="text" id="answer5">
        <br><br>

        <button onclick="finish()">Terminé!</button>
        <br><br>
        <button onclick="tryAgain()">Volver a intentar</button>

        <audio id="endAudio">
            <source src="gameover.mp3" type="audio/mpeg">
            Audio de fin de juego
        </audio>

        <script>
            let countdownTimeout;
            let timeInterval;

            function startCountdown(){
                countdownTimeout = setTimeout(timeUp, 30000);
                timeInterval = setInterval(tick, 1000);

                document.getElementById("countdown").textContent = 30;
            }

            function tick(){
                let time = document.getElementById("countdown").textContent;
                document.getElementById("countdown").textContent = time - 1
            }

            function timeUp(){
                clearInterval(timeInterval);
                document.getElementById("countdown").textContent = 0;
                document.getElementById("endAudio").play();
                alert("JUEGO FINALIZADO: Se acabó el tiempo, reinicia");
            }

            function finish(){
                clearTimeout(countdownTimeout);
                clearInterval(timeInterval);

                let date = new Date();
                let answer1 = document.getElementById("answer1").value;
                let answer2 = document.getElementById("answer2").value;
                let answer3 = document.getElementById("answer3").value;
                let answer4 = document.getElementById("answer4").value;
                let answer5 = document.getElementById("answer5").value;

                let message = date.toLocaleDateString("es-Es") + "\n" + 
                                "1. " + answer1 + "\n" +
                                "2. " + answer2 + "\n" +
                                "3. " + answer3 + "\n" +
                                "4. " + answer4 + "\n" +
                                "5. " + answer5
                
                alert(message)
            }

            function tryAgain(){
                location.reload();
            }
        </script>
    </body>
</html>
