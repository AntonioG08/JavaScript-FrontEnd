<!DOCTYPE html>

<head>
    <title>Mi primer objecto</title>
    <link>
    <script></script>
</head>

<body>
    <script>
        //Create an object constructor
        function Dog(breed, age, color) {
            //Object properties
            this.legs = 4;
            this.breed = breed;
            this.age = age;
            this.color = color;

            //Object method #1
            this.bark = function () {
                console.log("Woof");
            }
        }

        //Create some object instances
        let clifford = new Dog("Boxer", 8, "Brown");
        let pluto = new Dog("Labrador", 4, "Yellow");

        /*The "for... in" loop allows us to go through the properties 
          of an object in JS. For example in the "Dog" object, we can go
          through "legs", "breed", "age", "color", and even the method
          "bark". But we are NOT SEEING the value of that property, we 
          Are seeing the property, similar to how we go through a 
          dictionary in python, we iterate over the keys. To see the actual
          value we need to use the Object[property].
          
          Lets see the example belor:*/
        for (let property in clifford) {
            console.log(`${property}: ${clifford[property]}`);
        }

    </script>
</body>

</html>
