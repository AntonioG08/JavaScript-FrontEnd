<!DOCTYPE html>

<head>
    <title>Mi primer objecto</title>
    <link>
    <script></script>
</head>

<body>
    <script>
        //Initialize the first object in JS
        let myDog = {
            name: "Clifford",
            race: "Boxer",
            age: 8,
            bark() {
                console.log("Woof");
            }
        };

        //A function can be used to modify the parameters of an object
        function incrementAge() {
            myDog.age++;
        }

        //Call the function and also create a new element of the object
        incrementAge()
        myDog["eyesColor"] = "brown";
    </script>
</body>

</html>
