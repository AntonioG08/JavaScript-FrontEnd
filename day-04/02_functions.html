<!DOCTYPE html>
    <head>
        <title>
            Functions 102
        </title>
    </head>
    <body>
        <script>
            //Function created to sum 2 numbers and return the result
            function sumar(){
                resultado = 10+5;
                return resultado;
            }

            //Invoke the function and return it to the client side for visualization
            alert(sumar());

            let message = "El número es " + sumar();
            alert(message);
        </script>
    </body>
</html>
