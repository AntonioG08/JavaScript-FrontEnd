<!DOCTYPE html>
    <head>
        <title>Functions + Params</title>
    </head>
    <body>
        <h3>Primer número</h3>
        <input type="number" id="primerNumero">
        <br>
        <h3>Segundo número</h3>
        <input type="number" id="segundoNumero">
        <button onclick="mostrarResultado()">Calcular</button>
        <br>
        <br>
        <h2 id="textoResultado"></h2>
        <br>
        <br>
        <h3>Escriba un mensaje para mostrar</h3>
        <input type="text" id="mensajeUsuario">
        <button onclick="mandarMensaje()">Mostrar</button>


        <script>
            function sumar(num1, num2){
                //Receive 2 params, sum them, and return them
                result = +num1 + +num2;
                return result;
            }

            function mostrarResultado(){
                //
                let elementoNumero1 = document.getElementById("primerNumero");
                let elementoNumero2 = document.getElementById("segundoNumero");
                let elementoResultado = document.getElementById("textoResultado");
                let elementoSuma = sumar(elementoNumero1.value, elementoNumero2.value);

                elementoResultado.textContent = elementoSuma;
            }

            function mandarMensaje(){
                let mensajeUsuario = document.getElementById("mensajeUsuario");
                alert(mensajeUsuario.value);
            }
        </script>
    </body>
</html>
