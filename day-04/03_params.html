<!DOCTYPE html>
    <head>
        <title>Functions + Params</title>
    </head>
    <body>
        <h3>Primer número</h3>
        <input type="number" id="firstNumber">
        <br>
        <h3>Segundo número</h3>
        <input type="number" id="secondNumber">
        <button onclick="showResult()">Calcular</button>
        <br>
        <br>
        <h2 id="resultText"></h2>
        <br>
        <br>
        <h3>Escriba un mensaje para mostrar</h3>
        <input type="text" id="userMessage">
        <button onclick="sendMessage()">Mostrar</button>


        <script>
            function sum(num1, num2){
                //Receive 2 params, sum them, and return them
                result = +num1 + +num2;
                return result;
            }

            function showResult(){
                //
                let numberElement1 = document.getElementById("firstNumber");
                let numberElement2 = document.getElementById("secondNumber");
                let resultElement = document.getElementById("resultText");
                let sumElement = sum(numberElement1.value, numberElement2.value);

                resultElement.textContent = sumElement;
            }

            function sendMessage(){
                let userMessage = document.getElementById("userMessage");
                alert(userMessage.value);
            }
        </script>
    </body>
</html>
